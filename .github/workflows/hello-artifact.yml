name: Hello artifact test

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Optional request correlation ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Create JSON result
        shell: bash
        run: |
          cat > result.json <<'JSON'
          {
            "success": true,
            "message": "hello"
          }
          JSON

      - name: Upload JSON result
        uses: actions/upload-artifact@v4
        with:
          name: hello-result
          path: result.json
          if-no-files-found: error
          retention-days: 1
