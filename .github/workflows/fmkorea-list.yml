name: Crawl FMKorea list callback

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of FMKorea list pages to crawl (1-6)"
        required: false
        default: "6"
        type: string
      callback_url:
        description: "Callback URL for the completed crawl"
        required: true
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Crawl FMKorea list
        env:
          FMKOREA_CALLBACK_URL: ${{ inputs.callback_url }}
        run: python test_spark/get_fmkorea_pages.py --pages "${{ inputs.pages }}" --output result.json
