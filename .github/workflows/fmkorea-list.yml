name: Crawl FMKorea list artifact

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of FMKorea list pages to crawl (1-6)"
        required: false
        default: "6"
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Crawl FMKorea list
        run: python -m src.topic.fmkorea.get_fmkorea_pages --pages "${{ inputs.pages }}" --output result/topic/result.json

      - name: Upload JSON result
        uses: actions/upload-artifact@v4
        with:
          name: fmkorea-list
          path: result/topic/result.json
          if-no-files-found: error
          retention-days: 1
