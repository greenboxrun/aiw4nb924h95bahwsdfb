name: Crawl community IssueLink posts

on:
  schedule:
    # UTC 00:00 and 18:00 = KST 09:00 and 03:00.
    - cron: "0 0,18 * * *"
  workflow_dispatch:
    inputs:
      max_new_posts:
        description: "Maximum number of new posts to save"
        required: false
        default: "1000"
        type: string
      max_pages:
        description: "Maximum number of IssueLink pages to crawl"
        required: false
        default: "100"
        type: string
      retention_hours:
        description: "Retention period in hours"
        required: false
        default: "48"
        type: string

permissions:
  contents: write

concurrency:
  group: community-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Leave time for the always-run commit step after the 270-second crawl limit.
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Crawl community posts
        id: crawl
        shell: bash
        env:
          MAX_NEW_POSTS: ${{ inputs.max_new_posts || '1000' }}
          MAX_PAGES: ${{ inputs.max_pages || '100' }}
          RETENTION_HOURS: ${{ inputs.retention_hours || '48' }}
        run: >-
          timeout --signal=KILL --preserve-status 270s
          python -m src.community.issuelink_realtime_crawler
          --max-new-posts "$MAX_NEW_POSTS"
          --max-pages "$MAX_PAGES"
          --retention-hours "$RETENTION_HOURS"

      - name: Commit result
        if: always()
        shell: bash
        run: |
          if [ ! -f result/community/result.json ]; then
            echo "No community result file was created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result/community/result.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Update community crawl result"
          git push
