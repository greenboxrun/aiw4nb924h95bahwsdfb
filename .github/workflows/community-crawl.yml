name: Crawl community IssueLink posts

on:
  workflow_dispatch:
    inputs:
      max_new_posts:
        description: "Maximum number of posts to retain after collection"
        required: false
        default: "1000"
        type: string
      max_pages:
        description: "Maximum IssueLink pages to crawl (must be at least 10)"
        required: false
        default: "30"
        type: string
      retention_hours:
        description: "Retention period in hours"
        required: false
        default: "48"
        type: string

permissions:
  contents: write

concurrency:
  group: community-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Final safety limit for the complete crawl job, including checkpoint pushes.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Crawl community posts
        id: crawl
        shell: bash
        env:
          MAX_NEW_POSTS: ${{ inputs.max_new_posts || '1000' }}
          MAX_PAGES: ${{ inputs.max_pages || '15' }}
          RETENTION_HOURS: ${{ inputs.retention_hours || '48' }}
        run: >-
          python -u -m src.community.issuelink_realtime_crawler
          --max-new-posts "$MAX_NEW_POSTS"
          --max-pages "$MAX_PAGES"
          --retention-hours "$RETENTION_HOURS"
          --log-level DEBUG

      - name: Commit result
        if: always()
        shell: bash
        run: |
          if [ ! -f result/community/result.json ]; then
            echo "No community result file was created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result/community/result.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update community crawl result"
          fi
          git push

      - name: Upload crawl result artifact
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: community-crawl-result
          path: result/community/result.json
          if-no-files-found: error
          retention-days: 2
